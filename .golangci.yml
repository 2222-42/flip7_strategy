version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - durationcheck
    - forcetypeassert
    - misspell
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forcetypeassert
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/daioh/flip7_strategy
      extra-rules: true